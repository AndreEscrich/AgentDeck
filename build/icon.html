<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
</style></head><body>
<!-- AgentDeck app icon: a stack of three cards, the front one showing a prompt. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d3d"/>
      <stop offset="1" stop-color="#121319"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8875f"/>
      <stop offset="1" stop-color="#c4613f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px rounded square centered in 1024px -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- back cards -->
  <g filter="url(#shadow)">
    <rect x="300" y="250" width="440" height="520" rx="56" fill="#4a4e66" transform="rotate(-14 520 510)"/>
    <rect x="300" y="250" width="440" height="520" rx="56" fill="#6b708c" transform="rotate(-6 520 510)"/>
  </g>

  <!-- front card -->
  <g filter="url(#shadow)" transform="rotate(4 520 520)">
    <rect x="300" y="260" width="440" height="520" rx="56" fill="url(#front)"/>
    <rect x="301" y="261" width="438" height="518" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    <!-- prompt: chevron and cursor -->
    <polyline points="380,440 470,520 380,600" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="510" y="575" width="140" height="44" rx="22" fill="#ffffff"/>
  </g>
</svg>
</body></html>
