<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
</style></head><body>
<!-- Agent Hub app icon: three tanks like the agent tiles in the Hub.
     Green on the left (done), amber in the middle with bubbles (working),
     blue on the right (starting). Render with: npm run icon -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d3d"/>
      <stop offset="1" stop-color="#121319"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c060"/>
      <stop offset="1" stop-color="#c98a1c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74d39d"/>
      <stop offset="1" stop-color="#2f8f5a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa8f0"/>
      <stop offset="1" stop-color="#3d6bc4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#e0a83a" flood-opacity="0.45"/>
    </filter>
    <!-- Tank interiors, used to clip the liquid -->
    <clipPath id="clipLeft"><rect x="190" y="390" width="190" height="290" rx="34"/></clipPath>
    <clipPath id="clipMid"><rect x="400" y="270" width="224" height="410" rx="40"/></clipPath>
    <clipPath id="clipRight"><rect x="644" y="390" width="190" height="290" rx="34"/></clipPath>
  </defs>

  <!-- macOS icon grid: 824px rounded square centered in 1024px -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- The tanks and the shelf, moved down a little to sit in the optical center -->
  <g transform="translate(0 30)">
  <!-- Left tank: done, almost full -->
  <rect x="182" y="382" width="206" height="306" rx="40" fill="#0f1016" stroke="#2c2f3d" stroke-width="10"/>
  <g clip-path="url(#clipLeft)">
    <path d="M180 432 C 230 412, 290 452, 390 426 L 390 700 L 180 700 Z" fill="url(#green)"/>
  </g>
  <rect x="208" y="410" width="16" height="150" rx="8" fill="url(#shine)"/>

  <!-- Right tank: starting, low level -->
  <rect x="636" y="382" width="206" height="306" rx="40" fill="#0f1016" stroke="#2c2f3d" stroke-width="10"/>
  <g clip-path="url(#clipRight)">
    <path d="M634 596 C 690 580, 760 612, 844 590 L 844 700 L 634 700 Z" fill="url(#blue)"/>
  </g>
  <rect x="662" y="410" width="16" height="150" rx="8" fill="url(#shine)"/>

  <!-- Middle tank: working, with waves and bubbles -->
  <g filter="url(#glow)">
    <rect x="390" y="260" width="244" height="430" rx="46" fill="#0f1016" stroke="#34374a" stroke-width="12"/>
  </g>
  <g clip-path="url(#clipMid)">
    <path d="M396 452 C 460 420, 540 486, 628 440 L 628 700 L 396 700 Z" fill="url(#amber)"/>
    <path d="M396 452 C 460 420, 540 486, 628 440" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
    <circle cx="460" cy="600" r="14" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5"/>
    <circle cx="540" cy="530" r="20" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5"/>
    <circle cx="500" cy="380" r="11" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4"/>
    <circle cx="575" cy="630" r="9" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4"/>
  </g>
  <rect x="420" y="292" width="20" height="230" rx="10" fill="url(#shine)"/>

  <!-- A shelf the tanks stand on -->
  <rect x="160" y="712" width="704" height="22" rx="11" fill="#2c2f3d"/>
  </g>
</svg>
</body></html>
