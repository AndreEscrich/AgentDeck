<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
</style></head><body>
<!-- Agent Hub app icon: one tank like an agent tile in the Hub, in the
     Espresso & Amber colors. A warm brown square, almost edge to edge, holds
     one big glass tank, about two-thirds full of amber liquid with a wave
     and bubbles (an agent at work). At taskbar size (16-32 px) it reads as
     an amber block in a dark frame. Render with: npm run icon -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f25"/>
      <stop offset="1" stop-color="#140f0b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf72"/>
      <stop offset="1" stop-color="#d4821a"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#e9a23b" flood-opacity="0.5"/>
    </filter>
    <clipPath id="inside"><rect x="176" y="196" width="672" height="652" rx="104"/></clipPath>
  </defs>

  <!-- The square -->
  <rect x="20" y="20" width="984" height="984" rx="216" fill="url(#bg)"/>
  <rect x="22" y="22" width="980" height="980" rx="214" fill="none" stroke="#ffecd2" stroke-opacity="0.12" stroke-width="4"/>

  <!-- The tank: glowing amber, a thick warm rim -->
  <g filter="url(#glow)">
    <rect x="160" y="180" width="704" height="684" rx="120" fill="#0f0b08" stroke="#5a4a3a" stroke-width="30"/>
  </g>
  <g clip-path="url(#inside)">
    <!-- liquid, about two-thirds full, with a wave on top -->
    <path d="M170 440 C 300 380, 460 500, 600 440 S 800 390, 860 420 L 860 860 L 170 860 Z" fill="url(#amber)"/>
    <path d="M170 440 C 300 380, 460 500, 600 440 S 800 390, 860 420" fill="none" stroke="#fff3d6" stroke-opacity="0.55" stroke-width="12"/>
    <!-- bubbles -->
    <circle cx="350" cy="700" r="34" fill="#fff" fill-opacity="0.18" stroke="#fff6e0" stroke-opacity="0.9" stroke-width="11"/>
    <circle cx="560" cy="580" r="48" fill="#fff" fill-opacity="0.18" stroke="#fff6e0" stroke-opacity="0.9" stroke-width="12"/>
    <circle cx="690" cy="760" r="24" fill="#fff" fill-opacity="0.18" stroke="#fff6e0" stroke-opacity="0.9" stroke-width="9"/>
    <circle cx="470" cy="300" r="22" fill="none" stroke="#fff6e0" stroke-opacity="0.5" stroke-width="8"/>
    <!-- the glass: darker sides, a light band -->
    <rect x="170" y="190" width="690" height="670" fill="url(#side)"/>
  </g>
  <!-- highlights on the glass -->
  <rect x="216" y="236" width="40" height="420" rx="20" fill="url(#shine)"/>
  <rect x="280" y="250" width="22" height="150" rx="11" fill="#fff" fill-opacity="0.14"/>
</svg>
</body></html>
