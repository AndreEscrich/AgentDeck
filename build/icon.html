<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
</style></head><body>
<!-- Agent Hub app icon: three tanks like the agent tiles in the Hub.
     Green on the left (done), amber in the middle with bubbles (working),
     blue on the right (starting). The square fills almost the whole canvas
     and the tanks fill the square, so the icon reads at taskbar size (16-32
     px): there it is three bold colored bars. Render with: npm run icon -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30344a"/>
      <stop offset="1" stop-color="#15161d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#d9921c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86e2ad"/>
      <stop offset="1" stop-color="#2f9a5e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93b8ff"/>
      <stop offset="1" stop-color="#3f6fd0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#f2b13a" flood-opacity="0.55"/>
    </filter>
    <!-- Tank interiors, used to clip the liquid -->
    <clipPath id="clipLeft"><rect x="100" y="372" width="230" height="500" rx="52"/></clipPath>
    <clipPath id="clipMid"><rect x="370" y="160" width="284" height="712" rx="62"/></clipPath>
    <clipPath id="clipRight"><rect x="694" y="372" width="230" height="500" rx="52"/></clipPath>
  </defs>

  <!-- The square, almost edge to edge -->
  <rect x="20" y="20" width="984" height="984" rx="216" fill="url(#bg)"/>
  <rect x="22" y="22" width="980" height="980" rx="214" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Left tank: done, almost full -->
  <rect x="88" y="360" width="254" height="524" rx="64" fill="#0d0e14" stroke="#454a63" stroke-width="20"/>
  <g clip-path="url(#clipLeft)">
    <path d="M96 420 C 160 396, 250 444, 336 410 L 336 880 L 96 880 Z" fill="url(#green)"/>
  </g>
  <rect x="124" y="402" width="26" height="230" rx="13" fill="url(#shine)"/>

  <!-- Right tank: starting, a third full -->
  <rect x="682" y="360" width="254" height="524" rx="64" fill="#0d0e14" stroke="#454a63" stroke-width="20"/>
  <g clip-path="url(#clipRight)">
    <path d="M690 690 C 760 668, 850 712, 930 684 L 930 880 L 690 880 Z" fill="url(#blue)"/>
  </g>
  <rect x="718" y="402" width="26" height="230" rx="13" fill="url(#shine)"/>

  <!-- Middle tank: working, the tallest, glowing, with bubbles -->
  <g filter="url(#glow)">
    <rect x="356" y="146" width="312" height="740" rx="74" fill="#0d0e14" stroke="#575c78" stroke-width="24"/>
  </g>
  <g clip-path="url(#clipMid)">
    <path d="M366 400 C 440 360, 560 440, 660 384 L 660 880 L 366 880 Z" fill="url(#amber)"/>
    <path d="M366 400 C 440 360, 560 440, 660 384" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10"/>
    <circle cx="450" cy="700" r="26" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.85" stroke-width="9"/>
    <circle cx="568" cy="560" r="36" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.85" stroke-width="10"/>
    <circle cx="590" cy="780" r="18" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.85" stroke-width="8"/>
    <circle cx="500" cy="262" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="8"/>
  </g>
  <rect x="392" y="196" width="30" height="330" rx="15" fill="url(#shine)"/>
</svg>
</body></html>
