<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Agent Hub notifications</title>
  <!-- The notifications in the corner of the screen (src/toast.js): each is
       a copy of the agent's Hub tile, so it takes the app's own styles. -->
  <link rel="stylesheet" href="../../node_modules/@fontsource/nunito/400.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/nunito/600.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/nunito/700.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/nunito/800.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/fira-code/400.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme-mother.css" id="theme-mother" disabled>
  <link rel="stylesheet" href="theme-light.css" id="theme-light" disabled>
  <style>
    /* The window is see-through: only the tiles show. */
    html, html body.toast-page { background: transparent !important; margin: 0 !important; padding: 0 !important; overflow: hidden; }
    /* Nor the retro theme's tube around the screen. */
    html body.toast-page::before, html body.toast-page::after { display: none !important; }
    /* Laid out at their own size whatever the window's size, so they can be
       measured before the window grows to fit them. */
    #toasts { position: absolute; right: 0; bottom: 0; width: max-content; display: flex; align-items: flex-end; gap: 12px; padding: 22px 18px 18px; }
    .notice { width: 196px; transition: opacity 0.3s, transform 0.3s; }
    .notice.leaving { opacity: 0; transform: translateY(24px) scale(0.92); }
    .notice .hub-tile { box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.75); }
    /* What it is about, under the title: a few lines instead of one. */
    .notice .hub-step { white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; color: var(--text); }
    .notice .tile-stop, .notice .tile-restart { display: none !important; }
    .notice .tile-remove { opacity: 1; transform: scale(1); }
  </style>
</head>
<body class="toast-page">
  <div id="toasts"></div>
  <script src="scanreveal.js"></script>
  <script src="toastpage.js"></script>
</body>
</html>
