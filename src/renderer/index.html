<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:">
  <title>AgentDeck</title>
  <link rel="stylesheet" href="../../node_modules/@highlightjs/cdn-assets/styles/github-dark-dimmed.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- History: saved sessions and their groups, in a drawer over the window. -->
  <div id="drawer-backdrop"></div>
  <aside id="sidebar" class="history-drawer">
    <div class="drawer-head">
      <span class="drawer-title">History</span>
      <span>
        <button id="new-group-btn" class="icon" title="New category">＋</button>
        <button id="refresh" class="icon" title="Reload history">↻</button>
        <button id="close-history" class="icon" title="Close (Esc)">✕</button>
      </span>
    </div>
    <input id="search" type="search" placeholder="Search sessions… (⌘F)">
    <div id="history-list" class="list scroll"></div>
    <div class="sidebar-footer">
      <button id="open-settings" class="link">Settings</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="toggle-sidebar" class="icon sidebar-toggle" title="History (⌘\)">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="9" r="6.5"/>
          <polyline points="9,5.5 9,9 11.5,10.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="back-to-hub" class="back-btn hidden" title="Back to the Hub (⌘[)">← Hub</button>
      <div class="titles">
        <div id="view-title">AgentDeck</div>
        <div id="view-subtitle"></div>
      </div>
      <div class="actions">
        <span id="view-status" class="status-pill hidden"></span>
        <button id="btn-interrupt" class="hidden" title="Stop the current turn">Stop</button>
        <button id="btn-close" class="hidden" title="End this agent's process">Close agent</button>
      </div>
    </header>

    <section id="views">
      <div id="hub-view" class="view"></div>

      <!-- One .view.chat per agent or opened history session is added here by app.js -->
    </section>

    <footer id="composer" class="hidden">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Message the agent… (↩ to send, ⇧↩ for a new line)"></textarea>
        <div class="composer-bar">
          <div class="composer-pickers">
            <button id="composer-folder" class="model-btn hidden" type="button"></button>
            <button id="composer-group" class="model-btn hidden" type="button"></button>
            <span id="composer-fork" class="composer-fork hidden"></span>
            <div id="composer-mode-picker"></div>
            <div id="composer-picker"></div>
          </div>
          <button id="send" class="primary">Send</button>
        </div>
      </div>
    </footer>
  </main>

  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="../../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
  <script src="diffview.js"></script>
  <script src="render.js"></script>
  <script src="hub.js"></script>
  <script src="picker.js"></script>
  <script src="app.js"></script>
</body>
</html>
